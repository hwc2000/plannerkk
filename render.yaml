services:
  - type: web
    name: replan-demo
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: OPENAI_PLAN_MODEL
        value: gpt-4o-mini
      - key: REPLAN_SECURE_COOKIES
        value: "1"
